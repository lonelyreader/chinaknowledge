name: chinaknowledge-web

services:
  cms-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chinaknowledge
      POSTGRES_USER: chinaknowledge
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinaknowledge -d chinaknowledge"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cms_pgdata:/var/lib/postgresql/data

volumes:
  cms_pgdata:
